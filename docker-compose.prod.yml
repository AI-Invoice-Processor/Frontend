services:
  frontend:
    build:
      context: .
      args:
        VITE_DATA_MODE: ${VITE_DATA_MODE:-mock}
        VITE_API_BASE_URL: ${VITE_API_BASE_URL:-}
    image: ai-invoice-processor/frontend:latest
    restart: unless-stopped
    networks:
      - ai-invoice-network
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/health"]
      interval: 30s
      timeout: 5s
      retries: 3

  caddy:
    image: caddy:2.9-alpine
    restart: unless-stopped
    depends_on:
      frontend:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
      - caddy-config:/config
    networks:
      - ai-invoice-network

networks:
  ai-invoice-network:
    name: ai-invoice-network
    external: true

volumes:
  caddy-data:
  caddy-config:
