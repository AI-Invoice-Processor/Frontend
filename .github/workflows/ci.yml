name: Frontend CI

on:
  pull_request:
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]
  merge_group:

permissions:
  contents: read

jobs:
  quality:
    name: frontend-quality
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Check JavaScript syntax
        run: |
          for file in js/*.js; do node --check "$file"; done

      - name: Build static image
        run: docker build -t ai-invoice-processor/frontend:ci .

      - name: Check frontend health
        run: |
          container="$(docker run -d ai-invoice-processor/frontend:ci)"
          trap 'docker rm -f "$container"' EXIT
          for attempt in $(seq 1 20); do
            if docker exec "$container" wget -q -O /dev/null http://127.0.0.1/health; then
              exit 0
            fi
            sleep 1
          done
          exit 1

  conventional-commits:
    name: conventional-commits
    if: github.event_name != 'merge_group'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout history
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Validate commit messages and PR title
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          BASE_SHA: ${{ github.event_name == 'push' && github.event.before || github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event_name == 'push' && github.sha || github.event.pull_request.head.sha || github.sha }}
        run: node scripts/validate-conventional-commits.mjs
